[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "milai"
version = "0.2.0"
description = "AI language tutor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.22.2",
    "langfuse>=4.15.3",
    "openinference-instrumentation-openai-agents>=2.4.1",
    "python-dotenv>=1",
    "beautifulsoup4>=4.14",
]

[project.scripts]
milai = "milai.cli:main"

[tool.setuptools.package-data]
milai = ["prompts/*.md", "web/*"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "prek>=0.3.10",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.32",
]

[tool.ruff]
extend-exclude = [".agents", ".codex"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
    "S",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
